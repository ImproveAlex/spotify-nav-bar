name: Windows release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build, test and publish the portable executable
        run: ./build.ps1 -Publish -Runtime win-x64

      - name: Package the executable and checksums
        id: package
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content -LiteralPath 'src/SpotifyBar/SpotifyBar.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a numeric app version.' }
          $tag = "v$version-build.$env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifacts/release'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $exe = Join-Path $env:GITHUB_WORKSPACE 'artifacts/win-x64/SpotifyBar.exe'
          if (-not (Test-Path -LiteralPath $exe) -or (Get-Item -LiteralPath $exe).Length -eq 0) {
            throw 'The portable executable is missing or empty.'
          }
          $zip = Join-Path $output 'SpotifyBar-win-x64.zip'
          Compress-Archive -LiteralPath $exe -DestinationPath $zip -CompressionLevel Optimal -Force
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            if ($archive.Entries.Count -ne 1 -or $archive.Entries[0].FullName -cne 'SpotifyBar.exe') {
              throw 'The download ZIP must contain only SpotifyBar.exe at its root.'
            }
          } finally { $archive.Dispose() }
          $checksums = foreach ($file in @($zip, $exe)) {
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([System.IO.Path]::GetFileName($file))"
          }
          $checksums | Set-Content -LiteralPath (Join-Path $output 'SHA256SUMS.txt') -Encoding utf8NoBOM
          @(
            "tag=$tag"
            "version=$version"
          ) | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          APP_VERSION: ${{ steps.package.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifacts/release'
          $zip = Join-Path $output 'SpotifyBar-win-x64.zip'
          $sums = Join-Path $output 'SHA256SUMS.txt'
          $notes = Join-Path $output 'release-notes.md'
          @(
            'Download **SpotifyBar-win-x64.zip**, extract it, and run **SpotifyBar.exe**.'
            ''
            '- Windows 10/11 x64; portable, no installer or separate .NET installation.'
            '- Keep the Spotify desktop app open or minimized. Spotify Premium and app access are required.'
            '- Account sign-in uses browser authorization; playback uses the Spotify app.'
            '- Settings, encrypted sessions and help are created in Documents/SpotifyBar for each user.'
            '- The ZIP contains only the executable, with no saved accounts, tokens or personal settings.'
            '- SHA256SUMS.txt contains checksums for the ZIP and extracted executable.'
            ''
            "App version: $env:APP_VERSION. Build: $env:GITHUB_RUN_NUMBER, attempt: $env:GITHUB_RUN_ATTEMPT."
            "Source commit: $env:GITHUB_SHA"
            ''
            'Built on a clean GitHub-hosted Windows runner after the automated service checks passed.'
            'Live Spotify account playback and interactive desktop UI checks are not part of this workflow.'
          ) | Set-Content -LiteralPath $notes -Encoding utf8NoBOM
          $title = "Spotify Bar $env:APP_VERSION - build $env:GITHUB_RUN_NUMBER.$env:GITHUB_RUN_ATTEMPT"
          gh release create $env:RELEASE_TAG $zip $sums --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $title --notes-file $notes --draft
          if ($LASTEXITCODE -ne 0) { throw 'Release creation or asset upload failed; the release remains unpublished.' }
          # Draft tags do not exist yet, so find the draft via the release list, not /releases/tags/.
          $assetsJson = gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --slurp
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify release assets.' }
          $pages = ($assetsJson -join "`n") | ConvertFrom-Json
          $matches = @(foreach ($page in $pages) {
            foreach ($entry in $page) {
              if ($entry.tag_name -ceq $env:RELEASE_TAG -and $entry.draft) { $entry }
            }
          })
          if ($matches.Count -ne 1) { throw 'Could not identify the newly uploaded draft release.' }
          $release = $matches[0]
          foreach ($path in @($zip, $sums)) {
            $name = [System.IO.Path]::GetFileName($path)
            $assets = @($release.assets | Where-Object { $_.name -ceq $name -and $_.state -eq 'uploaded' })
            if ($assets.Count -ne 1 -or $assets[0].size -ne (Get-Item -LiteralPath $path).Length) {
              throw "The release asset was not uploaded completely: $name"
            }
          }
          $mainSha = gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq .sha
          if ($LASTEXITCODE -ne 0) { throw 'Could not check which release should be latest.' }
          $latest = if ($mainSha -eq $env:GITHUB_SHA) { 'true' } else { 'false' }
          $publish = Join-Path $output 'publish-release.json'
          @{ draft = $false; make_latest = $latest } | ConvertTo-Json | Set-Content -LiteralPath $publish -Encoding utf8NoBOM
          gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" --input $publish --jq .html_url
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the completed release.' }
          @(
            "### Released $env:RELEASE_TAG"
            "[Download the release](https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:RELEASE_TAG)"
            ''
            'The ZIP contains only SpotifyBar.exe. SHA-256 checksums are attached separately.'
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
